; ============================================================
; PlatformIO Configuration — Blink Test (PB5 Green LED)
; Board: STM32F103C8T6 "Blue Pill" (also works for GD32F103C8T6)
; Framework: Arduino (STM32duino)
; Upload: ST-Link V2 via SWD
; ============================================================

[env:bluepill_blink_test]
platform    = ststm32
board       = bluepill_f103c8
framework   = arduino
upload_protocol = stlink

; Use Serial over UART1 (PA9/PA10) — matches our HC-05 wiring
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON

; Monitor speed for serial debug (if connected)
monitor_speed = 9600
